<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211e1e">
<title>東京デザイナー・アカデミー殺人事件</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game" aria-label="東京デザイナー・アカデミー殺人事件">
  <div id="title">
    <audio id="titleBgm" src="audio/title.mp3" loop preload="auto"></audio>
    <img class="logo" src="images/title.png" alt="東京デザイナー・アカデミー殺人事件">
    <button class="start" type="button">▶ START</button>
    <p class="orientationHint">スマートフォンは横向きでお楽しみください</p>
    <div class="copy">2026 Masaaki Tsukioka All rights reserved</div>
  </div>
  <div id="screen">
    <nav class="commands" aria-label="コマンド"></nav>
    <div class="scene">
      <div class="imageArea">
        <img id="sceneImage" alt="">
        <img id="characterSprite" class="characterSprite" alt="">
        <div id="image" aria-live="polite"></div>
      </div>
    </div>
    <div class="message" id="message" tabindex="0" role="region" aria-label="セリフ。▼が表示されたらタップ、またはEnterキーで次へ"></div>
  </div>
</main>
<script src="game.js"></script>
</body>
</html>
